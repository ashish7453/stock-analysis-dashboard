# Posts the dashboard's charts to Instagram on a schedule.
# Setup and how to test: autopost/README.md
name: Instagram posts

on:
  schedule:                       # times are UTC (IST = UTC + 5:30); odd minutes on purpose:
                                  # GitHub delays runs at :00/:30 the most. Runs can still start late;
                                  # the script always posts the last finished session.
    - cron: "13 14 * * 1-5"       # India daily   Mon-Fri 7:43 PM IST
    - cron: "7 2 * * 2-6"         # USA daily     Tue-Sat 7:37 AM IST (previous US session)
    - cron: "3 3 * * 6"          # Weekly recap  Saturday 8:33 AM IST
    - cron: "37 2 * * 2-6"        # Global daily  Tue-Sat 8:07 AM IST (world indices, commodities)
    - cron: "33 3 * * 6"           # Global weekly Saturday 9:03 AM IST (+ currencies, 1 month)
  workflow_dispatch:              # "Run workflow" button on the Actions tab
    inputs:
      mode:
        description: Which post
        type: choice
        options: [india-daily, us-daily, weekly, global-daily, global-weekly]
        default: india-daily
      dry_run:
        description: Dry run (make the images only, don't post; download them from the run's Artifacts)
        type: boolean
        default: true
      force:
        description: Post again even if this post was already made
        type: boolean
        default: false

permissions:
  contents: write                 # to push the images to the social-posts branch

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt "kaleido>=1.0" pillow
          plotly_get_chrome -y || true     # chart-to-image needs Chrome (usually already on the runner)

      - name: Pick post
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "13 14 * * 1-5") m=india-daily ;;
            "7 2 * * 2-6")   m=us-daily ;;
            "3 3 * * 6")    m=weekly ;;
            "37 2 * * 2-6")  m=global-daily ;;
            "33 3 * * 6")     m=global-weekly ;;
            *)               m="${{ inputs.mode }}" ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Make charts and post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          args="--mode ${{ steps.pick.outputs.mode }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          python autopost/instagram_post.py $args

      - name: Keep the images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-${{ steps.pick.outputs.mode }}
          path: social-out/
          if-no-files-found: ignore
          retention-days: 14
